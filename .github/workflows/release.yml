name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    if: github.event.deleted == false
    uses: ./.github/workflows/platforms.yml

  publish:
    needs: platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ftun-*
          path: dist
          merge-multiple: true
      - name: Verify complete asset set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(find dist -type f | wc -l)" -eq 18
          for checksum in dist/*.sha256; do (cd dist && sha256sum -c "${checksum#dist/}"); done
          for platform in darwin-amd64 darwin-arm64 windows-amd64 windows-arm64 linux-amd64-musl linux-arm64-musl linux-armv7-musl linux-mips-musl linux-mipsel-musl; do
            extension=tar.gz
            case "${platform}" in windows-*) extension=zip;; esac
            test -f "dist/ftun-${RELEASE_TAG}-${platform}.${extension}"
          done
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --title "FTUN ${RELEASE_TAG#v}" --generate-notes)
          case "${RELEASE_TAG}" in *-*) flags+=(--prerelease);; esac
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* "${flags[@]}"
          fi
